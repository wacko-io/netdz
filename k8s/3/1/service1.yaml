apiVersion: v1
kind: Service
metadata:
  name: svc-nginx-mt
spec:
  selector:
    app: nginx-multitool
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
    - name: http-mt
      protocol: TCP
      port: 1180
      targetPort: 1180
    - name: https-mt
      protocol: TCP
      port: 443
      targetPort: 11443