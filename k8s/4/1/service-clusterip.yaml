apiVersion: v1
kind: Service
metadata:
  name: service-clusterip
  labels:
    app: multi-container
spec:
    selector:
        app: multi-container
    ports:
        - name: nginx
          protocol: TCP
          port: 9001
          targetPort: 80
        - name: multitool
          protocol: TCP
          port: 9002
          targetPort: 8080
