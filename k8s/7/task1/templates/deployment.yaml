apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "task1.fullname" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-multitool
  template:
    metadata:
      labels:
        app: nginx-multitool
    spec:
      containers:
        - name: nginx
          image: {{ .Values.nginx.repository }}:{{ .Values.nginx.tag }}
          ports:
            - containerPort: 80
        - name: multitool
          image: wbitt/network-multitool
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: HTTPS_PORT
              value: "11443"